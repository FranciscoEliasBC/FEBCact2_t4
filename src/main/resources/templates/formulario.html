<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
</head>
<body>
    <h1 th:text="${tituloProyecto}">Título</h1>
    <h2>Formulario de Producto</h2>

    <form action="#" th:action="@{/app/form}" th:object="${productoForm}" method="post">
        <label>Nombre:</label><br>
        <input type="text" th:field="*{nombre}" /><br><br>

        <label>Precio:</label><br>
        <input type="number" step="any" th:field="*{precio}" /><br><br>

        <label>Categoría:</label><br>
        <input type="text" th:field="*{categoria}" /><br><br>

        <button type="submit">Enviar Datos</button>
    </form>

    <br>
    <a th:href="@{/app/productos}">Volver al listado</a>
</body>
</html>
