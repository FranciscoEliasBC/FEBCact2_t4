<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
</head>
<body>
    <h1 th:text="${tituloProyecto}">Título</h1>
    <h2>Catálogo de Productos</h2>

    <a th:href="@{/app/form}">Registrar Nuevo Producto</a>
    <br><br>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.nombre}">Nombre</td>
                <td th:text="${p.precio}">0.0</td>
                <td th:text="${p.categoria}">Categoría</td>
                <td>
                    <a th:href="@{/app/productos/{id}(id=${p.id})}">Ver Detalle</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
